name: Feature request
description: Propose a scoped improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the investigator or operator problem, not only the proposed solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and success measure
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options: [Frontend, Backend, Parser, Detection, AI assurance, Security, Operations, Documentation]
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Security, privacy, and evidence implications
    validations:
      required: true
