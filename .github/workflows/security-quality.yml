name: security-quality
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Backend tests and dependency audit
        working-directory: backend
        run: |
          pip install -r requirements.txt pip-audit
          pytest -q
          python evals/run_eval.py
          python evals/run_vigil_eval.py
          python evals/run_phase2_eval.py
          python evals/run_adversarial_eval.py
          python evals/run_detection_eval.py
          pip-audit -r requirements.txt
      - name: Frontend build and dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm audit --audit-level=high
      - name: Build production images
        run: docker compose build
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: loginvestigator-x-backend:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
